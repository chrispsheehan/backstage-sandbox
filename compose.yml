services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-backstage} -d ${POSTGRES_DB:-backstage}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backstage:
    build:
      context: .
      dockerfile: Dockerfile
      target: backstage
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:7007}
      BACKEND_SECRET: ${BACKEND_SECRET:-local-backend-secret}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
    command:
      - node
      - packages/backend
      - --config
      - app-config.yaml
      - --config
      - app-config.compose.yaml
    ports:
      - '7007:7007'

volumes:
  postgres_data:
