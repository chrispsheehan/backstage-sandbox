apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: s3-static-website-pr
  title: S3 Static Website PR
  description: Open a PR against this repo that adds an app folder with a hello-world site and Crossplane S3 website manifests
  tags:
    - aws
    - crossplane
    - argocd
    - static-site
spec:
  owner: user:guest
  type: infrastructure
  parameters:
    - title: Website details
      required:
        - name
        - bucketName
      properties:
        name:
          title: App Folder Name
          type: string
          description: Folder name to create under apps/
          ui:field: EntityNamePicker
          ui:autofocus: true
        bucketName:
          title: S3 Bucket Name
          type: string
          description: Globally unique S3 bucket name for the website
          pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
        region:
          title: AWS Region
          type: string
          default: eu-west-2
        siteTitle:
          title: Site Title
          type: string
          default: Hello World
  steps:
    - id: fetchBase
      name: Fetch Base
      action: fetch:template
      input:
        url: ./s3-static-website
        values:
          name: ${{ parameters.name }}
          bucketName: ${{ parameters.bucketName }}
          region: ${{ parameters.region }}
          siteTitle: ${{ parameters.siteTitle }}
    - id: publishPullRequest
      name: Open Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=chrispsheehan&repo=backstage-sandbox
        branchName: scaffolder/s3-static-${{ parameters.name }}
        targetBranchName: main
        targetPath: apps/${{ parameters.name }}
        title: Add S3 static website app for ${{ parameters.name }}
        description: |
          Adds apps/${{ parameters.name }} with hello-world site content, Argo CD metadata, and Crossplane manifests for an S3 static website bucket.
        commitMessage: Add S3 static website app for ${{ parameters.name }}
        update: true
    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: 'Template executed'
        info: 'Opened a PR for apps/${{ parameters.name }}'
        severity: 'normal'
  output:
    links:
      - title: Pull Request
        url: https://github.com/chrispsheehan/backstage-sandbox/pull/${{ steps['publishPullRequest'].output.pullRequestNumber }}
