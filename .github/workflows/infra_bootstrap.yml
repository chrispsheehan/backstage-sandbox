name: EC2 Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select bootstrap to create the dev EC2 lab
        required: true
        type: choice
        options:
          - cancel
          - bootstrap
        default: cancel

concurrency:
  group: ec2-dev-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Publish image and apply dev infrastructure
    if: inputs.confirm == 'bootstrap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
      TG_NON_INTERACTIVE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Create and verify Backstage scaffold
        run: |
          corepack enable
          just install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set AWS account ID
        shell: bash
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" \
            >> "${GITHUB_ENV}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Set up Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: 1.1.6
          tf_path: terraform

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish bootstrap image before EC2 bootstrap
        run: just --justfile scripts/ci/justfile _push-image bootstrap

      - name: Apply all dev stacks
        run: just tg-all dev "apply -auto-approve"

      - name: Follow EC2 bootstrap logs
        run: just ec2-logs

      - name: Print platform URLs
        run: just tg dev aws/platform_host output

      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "## EC2 Bootstrap Complete"
            echo
            echo "- Environment: \`dev\`"
            echo "- Image tag: \`bootstrap\`"
            echo "- Terraform state bucket was retained."
          } >> "${GITHUB_STEP_SUMMARY}"
