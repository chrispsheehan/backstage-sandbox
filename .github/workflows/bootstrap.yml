name: EC2 Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ec2-dev-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Create and verify Backstage scaffold
        run: |
          corepack enable
          just install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Backstage image
        run: just --justfile scripts/build/justfile _build-backstage-image backstage:dev local

      - name: Save image
        run: docker save --output /tmp/backstage-image.tar backstage:dev

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: backstage-image
          path: /tmp/backstage-image.tar
          if-no-files-found: error
          compression-level: 0

  prepare-ecr:
    name: Prepare ECR
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      repository_url: ${{ steps.ecr.outputs.repository_url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set AWS account ID
        shell: bash
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" \
            >> "${GITHUB_ENV}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Set up Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: 1.1.6
          tf_path: terraform

      - name: Apply ECR stack
        run: terragrunt --non-interactive --working-dir infra/live/ci/aws/ecr apply -auto-approve

      - name: Get ECR repository URL
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          echo "repository_url=$(terragrunt --working-dir infra/live/ci/aws/ecr output -raw repository_url)" \
            >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy
    needs: [build-image, prepare-ecr]
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
      TF_VAR_allowed_ip_range: ${{ vars.ALLOWED_IP_RANGE }}
      TF_VAR_backstage_github_client_id: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      TF_VAR_backstage_github_client_secret: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: backstage-image
          path: /tmp/backstage-image

      - name: Load and push image to ECR
        shell: bash
        env:
          REPOSITORY_URL: ${{ needs.prepare-ecr.outputs.repository_url }}
        run: |
          set -euo pipefail
          docker load --input /tmp/backstage-image/backstage-image.tar
          registry="${REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}"
          docker tag backstage:dev "${REPOSITORY_URL}:dev"
          docker push "${REPOSITORY_URL}:dev"

      - name: Set AWS account ID
        shell: bash
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" \
            >> "${GITHUB_ENV}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Set up Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: 1.1.6
          tf_path: terraform

      - name: Apply all dev stacks
        working-directory: infra/live/dev
        run: terragrunt --non-interactive run --all -- apply -auto-approve

      - name: Follow EC2 bootstrap logs
        run: just ec2-logs

      - name: Print platform URLs
        working-directory: infra/live/dev/aws/platform_host
        run: terragrunt output

      - name: Write bootstrap summary
        shell: bash
        run: |
          {
            echo "## EC2 Bootstrap Complete"
            echo
            echo "- Environment: \`dev\`"
            echo "- Image tag: \`dev\`"
            echo "- Terraform state bucket was retained."
          } >> "${GITHUB_STEP_SUMMARY}"
