apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    # Upbound's PodIdentity path loads the AWS SDK default credential chain
    # without requiring the web-identity token file that its IRSA path hashes.
    # With no EKS credential endpoint injected into this k3d deployment, the
    # chain obtains temporary credentials from the EC2 instance profile via
    # IMDSv2.
    source: PodIdentity
