apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    # Upbound's IRSA path loads the AWS SDK default credential chain. Because
    # this k3d deployment has no web-identity environment variables, the chain
    # obtains temporary credentials from the EC2 instance profile via IMDSv2.
    source: IRSA
