apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-root
  namespace: argocd
  labels:
    backstage.io/bootstrap-seed: "true"
    backstage.io/git-source: "true"
spec:
  project: default
  source: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
