apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  admin.enabled: "false"
  url: __ARGOCD_URL__
  dex.auth.connectorId: github
  dex.config: |
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: __AUTH_GITHUB_CLIENT_ID__
          clientSecret: $dex.github.clientSecret
