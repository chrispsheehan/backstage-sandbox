apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: generated-argocd-apps
  namespace: argocd
  labels:
    backstage.io/git-source: "true"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        revision: main
        directories:
          - path: apps/*/argocd
        requeueAfterSeconds: 60
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-website'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
