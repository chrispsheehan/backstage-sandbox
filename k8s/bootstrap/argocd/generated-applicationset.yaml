apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: generated-argocd-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: __ARGOCD_REPO_URL__
        revision: __ARGOCD_BRANCH__
        directories:
          - path: apps/*/argocd
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-bootstrap'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: __ARGOCD_REPO_URL__
        targetRevision: __ARGOCD_BRANCH__
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
