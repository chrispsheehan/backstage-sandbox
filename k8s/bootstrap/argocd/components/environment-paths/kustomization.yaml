apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ConfigMap
      name: argocd-environment
      fieldPath: data.crossplaneRootPath
    targets:
      - select:
          kind: Application
          name: crossplane-root
        fieldPaths:
          - spec.source.path
        options:
          create: true
  - source:
      kind: ConfigMap
      name: argocd-environment
      fieldPath: data.providerConfigPath
    targets:
      - select:
          kind: Application
          name: crossplane-config
        fieldPaths:
          - spec.source.path
        options:
          create: true
  - source:
      kind: ConfigMap
      name: argocd-environment
      fieldPath: data.backstagePath
    targets:
      - select:
          kind: Application
          name: backstage
        fieldPaths:
          - spec.source.path
        options:
          create: true
