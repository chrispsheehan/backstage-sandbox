apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  template:
    spec:
      containers:
        - name: backstage
          env:
            - name: APP_BASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: APP_BASE_URL
            - name: PGSSLMODE
              value: no-verify
