apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-secret.yaml
  - backstage-secret.yaml
  - postgres.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - backstage.yaml
  - service.yaml

configMapGenerator:
  - name: backstage-runtime-config
    namespace: backstage
    files:
      - app-config.kubernetes.yaml
