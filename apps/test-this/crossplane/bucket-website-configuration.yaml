apiVersion: s3.aws.m.upbound.io/v1beta1
kind: BucketWebsiteConfiguration
metadata:
  name: test-this
  namespace: apps-test-this
  annotations:
    crossplane.io/poll-interval: "5m"
spec:
  forProvider:
    region: eu-west-2
    bucketRef:
      name: test-this
    indexDocument:
      suffix: index.html
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig
