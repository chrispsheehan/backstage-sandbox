<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7f2e8, #dceeff);
        color: #10233a;
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        max-width: 40rem;
        padding: 3rem;
        border: 1px solid rgba(16, 35, 58, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 80px rgba(16, 35, 58, 0.12);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>
        Hello from <strong>testy-test</strong>. This page is the starter
        content for the S3 static website scaffolded by Backstage.
      </p>
    </main>
  </body>
</html>
