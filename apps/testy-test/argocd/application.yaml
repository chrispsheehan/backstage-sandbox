apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testy-test-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:chrispsheehan/backstage-sandbox.git
    targetRevision: main
    path: apps/testy-test/crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-testy-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
